name: Test message from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create message file
        run: |
          echo "## Test Report" > /tmp/test-message.md
          echo "" >> /tmp/test-message.md
          echo "This is a test message from a file." >> /tmp/test-message.md
          echo "- Item 1" >> /tmp/test-message.md
          echo "- Item 2" >> /tmp/test-message.md
          cat /tmp/test-message.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          message-path: /tmp/test-message.md
          repo-token: ${{ github.token }}

      - name: Assert action ran with file message or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded posting message from file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
