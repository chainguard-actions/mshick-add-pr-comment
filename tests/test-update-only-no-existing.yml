name: Test update-only with no existing comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract repo info
        id: repo
        run: |
          echo "owner=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          message: "This should not be posted"
          repo-owner: ${{ steps.repo.outputs.owner }}
          repo-name: ${{ steps.repo.outputs.name }}
          update-only: "true"
          # allow-repeats=true skips the getExisting API call (existingComment stays undefined).
          # With existingComment=undefined and update-only=true, the action sets
          # comment-created=false and exits without creating a comment.
          # issue=1 avoids the listPullRequestsAssociatedWithCommit API call.
          allow-repeats: "true"
          issue: "1"
          message-id: "act-test-update-only-no-existing"

      - name: Assert comment-created is false
        env:
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
        run: |
          echo "comment-created: $COMMENT_CREATED"
          if [ "$COMMENT_CREATED" != "false" ]; then
            echo "FAIL: expected comment-created=false with update-only=true and no existing comment, got: $COMMENT_CREATED"
            exit 1
          fi
          echo "PASS: comment-created=false as expected"

      - name: Assert comment-id is empty
        env:
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "comment-id: $COMMENT_ID"
          if [ -n "$COMMENT_ID" ]; then
            echo "FAIL: expected no comment-id when update-only skips creation, got: $COMMENT_ID"
            exit 1
          fi
          echo "PASS: comment-id is empty as expected"
