name: Test attach-path and attach-text inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to attach
        run: |
          echo "This is an attachment file for testing." > /tmp/test-attachment.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Test message with attachment"
          attach-path: /tmp/test-attachment.txt
          attach-text: "Download the full report: %ARTIFACT_URL%"
          attach-name: test-attachment-artifact
          issue: "1"
          repo-token: ${{ github.token }}

      - name: Assert action ran (attach-path/attach-text inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with attach-path and attach-text inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
