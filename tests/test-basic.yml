name: Test basic usage - post message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Hello from test!"
          message-id: "test-basic"
          repo-token: ${{ github.token }}
      - name: Assert action ran and produced expected outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying outputs"
            if [ "$COMMENT_CREATED" != "true" ] && [ "$COMMENT_CREATED" != "false" ]; then
              echo "FAIL: comment-created output is unexpected: '$COMMENT_CREATED'"
              exit 1
            fi
            echo "PASS: action succeeded with comment-created='$COMMENT_CREATED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
