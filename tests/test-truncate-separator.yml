name: Test truncate-separator input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Test message with custom truncate separator"
          truncate: "simple"
          truncate-separator: "==="
          repo-token: ${{ github.token }}
          issue: "1"

      - name: Assert action ran (truncate-separator input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRUNCATED: ${{ steps.action.outputs.truncated }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "truncated: $TRUNCATED"
          echo "comment-created: $COMMENT_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
