name: Test commit comment target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current commit SHA: $SHA"

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Commit comment from test"
          comment-target: "commit"
          commit-sha: ${{ steps.get-sha.outputs.sha }}
          repo-token: ${{ github.token }}

      - name: Assert action ran with commit target or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded posting commit comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
