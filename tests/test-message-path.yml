name: Test message-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract repo info
        id: repo
        run: |
          echo "owner=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create message file
        run: |
          echo "## Test Message from File" > /tmp/pr-message.md
          echo "" >> /tmp/pr-message.md
          echo "This message was loaded from a file path." >> /tmp/pr-message.md

      - id: action
        uses: .
        with:
          message-path: "/tmp/pr-message.md"
          repo-owner: ${{ steps.repo.outputs.owner }}
          repo-name: ${{ steps.repo.outputs.name }}
          # update-only=true: only update if a comment already exists.
          # allow-repeats=true: skip the getExisting API call (existingComment stays undefined).
          # With existingComment=undefined and update-only=true, the action sets
          # comment-created=false and exits without making any write API calls.
          # issue=1 avoids the listPullRequestsAssociatedWithCommit API call.
          update-only: "true"
          allow-repeats: "true"
          issue: "1"
          message-id: "act-test-message-path"

      - name: Assert action completed without error
        env:
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
        run: |
          echo "comment-created: $COMMENT_CREATED"
          # With update-only=true and allow-repeats=true, no existing comment is found,
          # so comment-created=false regardless of PR context.
          if [ "$COMMENT_CREATED" != "false" ]; then
            echo "FAIL: expected comment-created=false when update-only=true and no existing comment, got: $COMMENT_CREATED"
            exit 1
          fi
          echo "PASS: action handled message-path gracefully"
