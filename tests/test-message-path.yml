name: Test message from file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create message file
        run: |
          echo "## Test Report" > /tmp/pr-message.md
          echo "This is a test message from a file." >> /tmp/pr-message.md
          echo "- Item 1" >> /tmp/pr-message.md
          echo "- Item 2" >> /tmp/pr-message.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          message-path: /tmp/pr-message.md
          repo-token: ${{ github.token }}

      - name: Assert action ran with file-based message or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying outputs"
            if [ -z "$COMMENT_CREATED" ]; then
              echo "FAIL: action succeeded but comment-created output is empty"
              exit 1
            fi
            echo "PASS: comment-created=$COMMENT_CREATED, comment-id=$COMMENT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
