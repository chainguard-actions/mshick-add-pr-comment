name: Test preformatted message in codeblock
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: |
            key: value
            another_key: another_value
          preformatted: "true"
          message-id: "test-preformatted"
          allow-repeats: "true"

      - name: Assert action ran with preformatted message
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with preformatted message"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
