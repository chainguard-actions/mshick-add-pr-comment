name: Test preformatted message mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create preformatted message file
        run: |
          cat > /tmp/preformatted-message.txt << 'EOF'
          Error: something went wrong
            at line 42 in main.js
            at line 10 in index.js
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          message-path: /tmp/preformatted-message.txt
          preformatted: "true"
          message-id: "test-preformatted"
          repo-token: ${{ github.token }}

      - name: Assert action ran (preformatted mode - comment created or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENT_CREATED" ]; then
              echo "FAIL: action succeeded but comment-created output is empty"
              exit 1
            fi
            echo "PASS: comment-created=$COMMENT_CREATED, comment-id=$COMMENT_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
