name: Test update-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "This should only update, not create"
          update-only: "true"
          message-id: "test-update-only"

      - name: Assert action ran in update-only mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_UPDATED: ${{ steps.action.outputs.comment-updated }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-updated: $COMMENT_UPDATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            # In update-only mode with no existing comment, comment-created should be false
            echo "comment-created value: $COMMENT_CREATED"
            if [ "$COMMENT_CREATED" = "true" ]; then
              echo "FAIL: update-only mode should not create a new comment"
              exit 1
            fi
            echo "PASS: action succeeded in update-only mode without creating a comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
