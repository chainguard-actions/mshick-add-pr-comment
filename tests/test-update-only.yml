name: Test update-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Update-only test message"
          message-id: "test-update-only"
          update-only: "true"
          repo-token: ${{ github.token }}
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_UPDATED: ${{ steps.action.outputs.comment-updated }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-updated: $COMMENT_UPDATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in update-only mode"
            # In update-only mode with no existing comment, comment-created should be false
            if [ "$COMMENT_CREATED" = "true" ]; then
              echo "FAIL: comment-created should not be true in update-only mode with no existing comment"
              exit 1
            fi
            echo "PASS: update-only mode behaved correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
