name: Test update-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "This should only update, not create"
          update-only: "true"
          message-id: "test-update-only-id"
          repo-token: ${{ github.token }}

      - name: Assert action ran in update-only mode or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_CREATED: ${{ steps.action.outputs.comment-created }}
          COMMENT_UPDATED: ${{ steps.action.outputs.comment-updated }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-created: $COMMENT_CREATED"
          echo "comment-updated: $COMMENT_UPDATED"
          echo "comment-id: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in update-only mode"
            # In update-only mode with no existing comment, comment-created should be false/empty
            echo "PASS: update-only mode completed, comment-created=$COMMENT_CREATED, comment-updated=$COMMENT_UPDATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
